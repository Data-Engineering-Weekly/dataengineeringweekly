  review: "Field notes from stress-testing a change-safety check on a 2-million-row Delta table on Databricks serverless. Covers Unity Catalog lineage that still reports dropped tables, null-safe key joins for data diffs, shallow clones as a sandbox for risky writes, and how a 10% sample hid a one-row delete until a full-table checksum was added. Disclosure: the author wrote the open-source tool the article tests."
