  review: "A runnable Python and SQLite experiment showing why a pipeline's checkpoint must be committed atomically with its data. It injects a failure before checkpoint advancement, restores a backup into a separate database, replays the input, and checks event identities, amounts, progress, and conflict rollback. The walkthrough states its single-writer, immutable-batch assumptions and distinguishes in-memory state-consistency checks from durable disaster recovery."
